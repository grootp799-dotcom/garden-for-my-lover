<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สวนดอกไม้ของเรา</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600&display=swap">
<style>
:root{--glass:rgba(255,255,255,.55);--ink:#7a2e4d;--accent:#e0457b;--card:rgba(255,248,250,.94);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--glass:rgba(40,16,40,.5);--ink:#ffd9e8;--accent:#ff8fb6;--card:rgba(48,22,48,.94)}}
:root[data-theme="dark"]{--glass:rgba(40,16,40,.5);--ink:#ffd9e8;--accent:#ff8fb6;--card:rgba(48,22,48,.94)}
html,body{height:100%;margin:0}
body{background:#f4b6cf;overflow:hidden;font-family:"Mali","Sarabun","Noto Sans Thai",system-ui,sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.glass{background:var(--glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-radius:999px;box-shadow:0 4px 18px rgba(120,30,80,.18)}
#top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 14px 0;display:flex;justify-content:space-between;align-items:center;gap:8px;pointer-events:none}
#count{padding:9px 15px;font-size:14px;font-weight:600}
#btns{display:flex;gap:8px;pointer-events:auto}
.ib{width:44px;height:44px;font-size:20px;padding:0}
#hint{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);text-align:center;font-size:13px;pointer-events:none;transition:opacity 1.2s}
#hint span{display:inline-block;padding:8px 16px}
.ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:20px;transition:opacity .9s;text-align:center;z-index:5}
.ov.off{opacity:0;pointer-events:none}
#intro{background:radial-gradient(circle at 50% 30%,rgba(255,220,235,.97),rgba(197,150,216,.97));color:#6b2145}
#intro h1{font-size:28px;margin:6px 0}
#intro p{margin:6px 0 24px;font-size:16px;line-height:1.8}
.big{font-size:56px;animation:fl 3s ease-in-out infinite}
.cta{padding:14px 36px;border-radius:999px;background:#e0457b;color:#fff;font-size:17px;box-shadow:0 8px 24px rgba(224,69,123,.45);animation:pulse 2s infinite}
#card{background:rgba(50,15,45,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.paper{width:min(440px,90%);max-height:86%;overflow:auto;padding:30px 24px 24px;border-radius:24px;background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.3);line-height:1.95}
.paper h2{margin:0 0 10px;font-size:22px}
.paper p{margin:10px 0;font-size:16px;animation:rise 1s both}
.paper .from{margin-top:18px;font-weight:600;color:var(--accent)}
.paper button{margin-top:18px;padding:10px 28px;border-radius:999px;background:var(--accent);color:#fff}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translateX(-50%);padding:10px 18px;font-size:14px;font-weight:600;opacity:0;transition:opacity .5s;pointer-events:none;width:max-content;max-width:88%;text-align:center;border-radius:22px;z-index:4}
#end{background:rgba(20,8,40,.35);transition:opacity .9s,background .9s}#end.clear{background:transparent}
#end h2{font-size:21px;line-height:1.6}#end button{margin:12px 6px 0;padding:12px 26px;border-radius:999px;background:var(--accent);color:#fff;transition:transform .3s}#end #no{background:var(--glass);color:var(--ink)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fl{50%{transform:translateY(-8px) rotate(6deg)}}
@keyframes pulse{50%{transform:scale(1.06)}}
</style>
</head>

<div id="top"><div id="count" class="glass"></div><div id="btns"><button id="dn" class="ib glass" aria-label="กลางวันกลางคืน">🌙</button><button id="mus" class="ib glass" aria-label="เพลง">🎵</button><button id="msg" class="ib glass" aria-label="ข้อความ">💌</button></div></div>
<div id="hint"><span class="glass">แตะดอกตูมให้บาน · แตะพื้นหญ้าเพื่อปลูกดอกไม้</span></div>
<div id="toast" class="glass"></div>

<div id="intro" class="ov"><div><div class="big">🌸</div><h1 id="iTo"></h1><p>สวนเล็ก ๆ ที่ปลูกไว้เพื่อเธอ<br>แตะดอกไม้ทุกดอก แล้วมาดูกันว่ามีอะไรรออยู่</p><button id="enter" class="cta">เข้าสู่สวน 💗</button><div style="margin-top:18px;font-size:11px;opacity:.5">v7</div></div></div>

/* ========================= */
const $=id=>document.getElementById(id),R=(a,b)=>a+Math.random()*(b-a);
const cv=$('c'),ctx=cv.getContext('2d');
let W,H,D,U,bg,bgN,fg,fgN,night=0,nT=0,t=0,last=0,N=6,shown=0,flowers=[],sp=[];
$('iTo').textContent='ถึง'+CONFIG.to;

function resize(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,2);U=Math.max(.8,Math.min(1.3,Math.min(W,H)/450));cv.width=W*D;cv.height=H*D;buildBg()}
function buildBg(){[bg,fg]=mkBg(0);[bgN,fgN]=mkBg(1)}
function mkBg(n){
  const c=document.createElement('canvas');c.width=W*D;c.height=H*D;const b=c.getContext('2d');b.scale(D,D);
  const hz=H*.6,SK=n?['#0d0f36','#3b2a6e','#c46c9c']:['#c9a2d8','#f4b6cf','#ffdcba'];
  let g=b.createLinearGradient(0,0,0,hz);g.addColorStop(0,SK[0]);g.addColorStop(.55,SK[1]);g.addColorStop(1,SK[2]);b.fillStyle=g;b.fillRect(0,0,W,H);
  if(n)for(let i=0;i<120;i++){b.fillStyle=`rgba(255,255,240,${R(.3,.9)})`;b.beginPath();b.arc(R(0,W),R(0,hz*.85),R(.4,1.4),0,7);b.fill()}
  const gx=W*.78,gy=n?hz*.28:hz*.7;g=b.createRadialGradient(gx,gy,0,gx,gy,W*.55);
  if(n){g.addColorStop(0,'rgba(215,225,255,.6)');g.addColorStop(.25,'rgba(170,160,235,.22)');g.addColorStop(1,'rgba(170,160,235,0)')}
  else{g.addColorStop(0,'rgba(255,246,205,.95)');g.addColorStop(.25,'rgba(255,224,190,.5)');g.addColorStop(1,'rgba(255,224,190,0)')}
  b.fillStyle=g;b.fillRect(0,0,W,H);
  if(n){b.fillStyle='#fff8e2';b.beginPath();b.arc(gx,gy,Math.max(14,W*.035),0,7);b.fill()}
  else{
    for(let i=0;i<5;i++){const a=1.9+i*.28;b.fillStyle='rgba(255,246,215,.07)';b.beginPath();b.moveTo(gx,gy);b.lineTo(gx+Math.cos(a)*W*1.3,gy+Math.sin(a)*W*1.3);b.lineTo(gx+Math.cos(a+.1)*W*1.3,gy+Math.sin(a+.1)*W*1.3);b.fill()}
    for(let i=0;i<5;i++){const x=R(0,W),y=R(hz*.1,hz*.6);b.fillStyle='rgba(255,255,255,.28)';for(let j=0;j<4;j++){b.beginPath();b.ellipse(x+j*38,y+R(-6,6),R(40,70),R(10,16),0,0,7);b.fill()}}
  }
  const hill=(col,base,amp,fr,ph)=>{b.fillStyle=col;b.beginPath();b.moveTo(0,H);for(let x=0;x<=W+8;x+=8)b.lineTo(x,base+Math.sin(x*fr+ph)*amp+Math.sin(x*fr*2.3+ph*2)*amp*.4);b.lineTo(W,H);b.fill()};
  const HC=n?['#3c2f6c','#2b4a5c']:['#cfa6d2','#b8c9a0'],GC=n?['#2e6a58','#163e3a']:['#8cc778','#4c9a4e'];
  hill(HC[0],hz-H*.06,H*.04,.004,1);hill(HC[1],hz-H*.02,H*.03,.006,3);
  g=b.createLinearGradient(0,hz,0,H);g.addColorStop(0,GC[0]);g.addColorStop(1,GC[1]);hill(g,hz+H*.01,H*.012,.01,5);
  for(let i=0;i<W*1.3;i++){const y=R(hz+8,H),x=R(0,W),L=5+(y-hz)/H*32,l=n?R(16,34):R(35,60);
    b.strokeStyle=`hsla(${R(90,125)},50%,${l}%,.8)`;b.lineWidth=R(1,2);b.beginPath();b.moveTo(x,y);b.quadraticCurveTo(x+R(-4,4),y-L*.6,x+R(-8,8),y-L);b.stroke()}
  for(let i=0;i<90;i++){const y=R(hz+14,H*.98);b.fillStyle=(n?['#cfd8ff','#ffd9ec','#fff3b0']:['#fff','#ffe3ef','#fff3b0'])[i%3];b.beginPath();b.arc(R(0,W),y,R(1,2.6)*(y/H),0,7);b.fill()}
  const fc=document.createElement('canvas');fc.width=W*D;fc.height=H*D;const f=fc.getContext('2d');f.scale(D,D);
  for(let i=0;i<W*.5;i++){const x=R(0,W),L=R(26,70)*U,y=H+2;f.strokeStyle=`hsla(${R(95,125)},${n?35:55}%,${n?R(14,26):R(28,46)}%,.95)`;f.lineWidth=R(1.5,3.2);f.beginPath();f.moveTo(x,y);f.quadraticCurveTo(x+R(-8,8),y-L*.6,x+R(-16,16),y-L);f.stroke()}
  const v=f.createRadialGradient(W/2,H/2,Math.min(W,H)*.45,W/2,H/2,Math.max(W,H)*.8);v.addColorStop(0,'rgba(60,20,60,0)');v.addColorStop(1,`rgba(40,10,50,${n?.45:.28})`);f.fillStyle=v;f.fillRect(0,0,W,H);
  return[c,fc]
}

  return{fx,fy,type,hue:pal[Math.random()*pal.length|0],sat:type==1?55:R(65,85),lit:type==1?96:R(58,68),k:R(.85,1.15),hh:R(95,170),rr:R(26,38),ph:R(0,7),rot:R(0,6),bloom:0,want:0,stem:init?1:0,init,hx:0,hy:0,r:30}
}
const IMG=new Image();IMG.src=SECRET;let bl=0,tt;
function makeSecret(){const f=make(R(.12,.88),R(.74,.92),false);f.type=3;f.secret=1;f.hue=335;f.sat=75;f.lit=70;f.hh=R(150,190);f.rr=60;f.k=1.05;return f}
function spawnSecret(){const f=makeSecret();flowers.push(f);flowers.sort((a,b)=>a.fy-b.fy);burst(f.fx*W,f.fy*H,16);toast('✨ มีดอกไม้ลับโผล่ขึ้นมาในสวน หาให้เจอนะ')}
function toast(m){const e=$('toast');e.textContent=m;e.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>e.style.opacity=0,3800)}
function leaf(x,y,d,L){ctx.save();ctx.translate(x,y);ctx.rotate(-d*.5);ctx.fillStyle='#5fa04c';ctx.beginPath();ctx.moveTo(0,0);ctx.quadraticCurveTo(d*L*.5,-L*.4,d*L,0);ctx.quadraticCurveTo(d*L*.5,L*.3,0,0);ctx.fill();ctx.restore()}
function pet(n,len,wid,off,c1,c2){
  const g=ctx.createLinearGradient(0,0,len,0);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.strokeStyle='rgba(120,40,80,.14)';ctx.lineWidth=.8;ctx.save();ctx.rotate(off);
  for(let i=0;i<n;i++){ctx.beginPath();ctx.moveTo(0,0);ctx.bezierCurveTo(len*.25,-wid,len*.95,-wid*.8,len,0);ctx.bezierCurveTo(len*.95,wid*.8,len*.25,wid,0,0);ctx.fill();ctx.stroke();ctx.rotate(6.2832/n)}
  ctx.restore()
}
function dot(r,c1,c2){const g=ctx.createRadialGradient(0,0,0,0,0,r);g.addColorStop(0,c1);g.addColorStop(1,c2);ctx.fillStyle=g;ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.fill()}
function drawF(f){
  const s=f.k*U*(.5+f.fy*.8),x=f.fx*W,y=f.fy*H;
  f.stem+=(1-f.stem)*.07;f.bloom+=(f.want-f.bloom)*.05;
  const g=f.stem,h=f.hh*s*g,sw=Math.sin(t*.0012+f.ph)*5*s*(.4+.6*f.bloom),hx=x+sw,hy=y-h;
  f.hx=hx;f.hy=hy;f.r=f.rr*s;
  ctx.fillStyle='rgba(70,40,60,.16)';ctx.beginPath();ctx.ellipse(x,y+2*s,16*s,4.5*s,0,0,7);ctx.fill();
  ctx.strokeStyle='#4e8c42';ctx.lineWidth=3.4*s;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(x,y);ctx.quadraticCurveTo(x-sw*.4,y-h*.55,hx,hy);ctx.stroke();
  if(g>.35){leaf(x+sw*.08,y-h*.32,-1,20*s*g);leaf(x+sw*.2,y-h*.55,1,17*s*g)}
  if(g<.5)return;
  const b=f.bloom,c=d=>`hsl(${f.hue},${f.sat}%,${Math.max(10,Math.min(98,f.lit+d))}%)`;
  ctx.save();ctx.translate(hx,hy);ctx.rotate(sw*.012);
  if(b<.1){
    const p=1+.06*Math.sin(t*.004+f.ph);ctx.scale(p,p);
    ctx.fillStyle=f.secret?'hsl(45,95%,62%)':c(0);ctx.beginPath();ctx.ellipse(0,-7*s,7.5*s,12*s,0,0,7);ctx.fill();
    ctx.fillStyle='#5a9a48';ctx.beginPath();ctx.ellipse(-4*s,-1*s,3.5*s,8*s,.5,0,7);ctx.fill();ctx.beginPath();ctx.ellipse(4*s,-1*s,3.5*s,8*s,-.5,0,7);ctx.fill();
  }else{
    const e=Math.min(1.12,1+2.7*Math.pow(b-1,3)+1.7*Math.pow(b-1,2)),r=f.r*e;ctx.rotate(-(1-b)*.9);if(night>.05){ctx.globalAlpha=night*.55;dot(r*1.5,'rgba(255,190,225,.55)','rgba(255,190,225,0)');ctx.globalAlpha=1}
    if(f.type==0){for(let k=0;k<4;k++){const L=r*(1-k*.2);pet(8-k,L,L*(.56-k*.03),k*.6+f.rot,c(-22+k*2),c(10-k*3))}dot(r*.12,c(-30),c(-18))}
    else if(f.type==1){pet(15,r,r*.15,f.rot,'#fff',c(-6));pet(15,r*.8,r*.14,f.rot+.2,'#fff',c(-2));dot(r*.2,'#ffe27a','#f0a020')}
    else if(f.type==2){pet(5,r,r*.5,f.rot,c(-14),c(12));pet(5,r*.62,r*.34,f.rot+.6,c(-24),c(2));dot(r*.12,'#ffe27a','#e8a030')}
    else{
      dot(r*1.5,'rgba(255,225,140,.55)','rgba(255,225,140,0)');
      pet(10,r,r*.32,f.rot,c(-12),c(14));pet(10,r*.85,r*.3,f.rot+.31,c(-4),c(18));
      ctx.rotate((1-b)*.9);const fr=r*.6;ctx.save();ctx.beginPath();ctx.arc(0,0,fr,0,7);ctx.clip();
      if(IMG.complete&&IMG.naturalWidth)ctx.drawImage(IMG,-fr,-fr,fr*2,fr*2);else{ctx.fillStyle='#ffd6e6';ctx.fill()}
      ctx.restore();ctx.lineWidth=Math.max(2,r*.05);ctx.strokeStyle='#fff';ctx.beginPath();ctx.arc(0,0,fr,0,7);ctx.stroke()
    }
  }
  ctx.restore();
  if(b<.1&&g>.9&&!f.secret)star(hx,hy-26*s,2.2,.5+.5*Math.sin(t*.005+f.ph));
  if(f.secret&&g>.9){const R0=b<.1?28*s:f.r*1.2,a=.6+.4*Math.sin(t*.006);for(let j=0;j<3;j++){const an=t*.0015+j*2.094;star(hx+Math.cos(an)*R0,hy+Math.sin(an)*R0*.8,3,a)}}
}
function bloomIt(f){
  if(f.want)return;f.want=1;burst(f.hx,f.hy,f.secret?70:26);chime();updCount();for(let i=0;i<6;i++)spawnPetal(f.hx+R(-20,20),f.hy);
  if(f.secret){toast('✨ เจอดอกไม้ลับแล้ว! มีดอกนี้ดอกเดียวในสวนของเธอ 💗');return}
  if(++bl%10==0)setTimeout(spawnSecret,1100);
  $('hint').style.opacity=0;
  if(!shown&&flowers.filter(q=>q.init&&q.want).length>=N){shown=1;setTimeout(openCard,1700)}
}
function updCount(){const n=flowers.filter(f=>f.want&&!f.secret).length;$('count').textContent=n<N?`🌸 บานแล้ว ${n}/${N}`:`🌸 บานครบสวนแล้ว ${n} ดอก`}

/* ===== แสงระยิบระยับ ===== */
function star(x,y,r,a){
  ctx.globalAlpha=Math.max(0,a);const g=ctx.createRadialGradient(x,y,0,x,y,r*2.2);g.addColorStop(0,'rgba(255,250,220,1)');g.addColorStop(1,'rgba(255,250,220,0)');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*2.2,0,7);ctx.fill();
  ctx.strokeStyle='rgba(255,252,235,.9)';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(x-r*3,y);ctx.lineTo(x+r*3,y);ctx.moveTo(x,y-r*3);ctx.lineTo(x,y+r*3);ctx.stroke();ctx.globalAlpha=1
}
function burst(x,y,n){
  for(let i=0;i<n;i++){const a=R(0,6.28),v=R(1,4);sp.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-1.2,l:1,dc:R(.012,.02),sz:R(1.5,3),k:0})}
  for(let i=0;i<Math.ceil(n/5);i++)sp.push({x,y,vx:R(-1,1),vy:-R(.8,2),l:1,dc:.008,sz:R(12,20),k:1})
}
const GL=Array.from({length:70},()=>({x:Math.random(),y:Math.random(),ph:R(0,7),sp:R(.00004,.00012),sz:R(.8,2.2)}));
function drawGlints(){
  for(const g of GL){const y=((g.y-t*g.sp)%1+1)%1;if(y>.92)continue;star(g.x*W+Math.sin(t*.0007+g.ph)*14,y*H,g.sz,.15+.55*(.5+.5*Math.sin(t*.003+g.ph)))}
}
function drawSp(dt){
  const k=dt/16;
  for(let i=sp.length-1;i>=0;i--){const p=sp[i];p.x+=p.vx*k;p.y+=p.vy*k;p.l-=p.dc*k;if(p.l<=0){sp.splice(i,1);continue}
    if(p.k==0){p.vx*=.97;p.vy+=.03*k;star(p.x,p.y,p.sz*(.4+p.l*.6),p.l)}
    else{p.x+=Math.sin(t*.005+i)*.4;ctx.globalAlpha=p.l;ctx.fillStyle='#ff6b9a';ctx.font=p.sz+'px sans-serif';ctx.textAlign='center';ctx.fillText('♥',p.x,p.y);ctx.globalAlpha=1}}
}

/* ===== กลางคืน กลีบดอกไม้ ===== */
const FF=Array.from({length:36},()=>({x:R(0,innerWidth),y:R(innerHeight*.45,innerHeight*.95),a:R(0,6.28),v:R(.3,.8),ph:R(0,7)})),SS=[];let ssT=0;
function drawNight(dt){
  if(night<.02)return;
  for(const f of FF){f.x+=Math.cos(f.a)*f.v*dt/16;f.y+=Math.sin(f.a)*f.v*dt/16;f.a+=R(-.08,.08);if(f.x<0)f.x=W;if(f.x>W)f.x=0;if(f.y<H*.4)f.y=H*.92;if(f.y>H*.97)f.y=H*.45;
    ctx.globalAlpha=night*(.35+.65*Math.abs(Math.sin(t*.002+f.ph)));const g=ctx.createRadialGradient(f.x,f.y,0,f.x,f.y,9);g.addColorStop(0,'rgba(225,255,150,1)');g.addColorStop(.3,'rgba(190,255,120,.5)');g.addColorStop(1,'rgba(190,255,120,0)');ctx.fillStyle=g;ctx.beginPath();ctx.arc(f.x,f.y,9,0,7);ctx.fill()}
  ctx.globalAlpha=1;ssT-=dt;if(ssT<=0&&night>.6){ssT=R(2500,6000);SS.push({x:R(W*.3,W),y:R(0,H*.25),vx:-R(7,10),vy:R(3,5),l:1})}
  for(let i=SS.length-1;i>=0;i--){const s=SS[i];s.x+=s.vx*dt/16;s.y+=s.vy*dt/16;s.l-=.012*dt/16;if(s.l<=0){SS.splice(i,1);continue}
    const g=ctx.createLinearGradient(s.x,s.y,s.x-s.vx*7,s.y-s.vy*7);g.addColorStop(0,`rgba(255,255,255,${s.l})`);g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.strokeStyle=g;ctx.lineWidth=2;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.lineTo(s.x-s.vx*7,s.y-s.vy*7);ctx.stroke();star(s.x,s.y,1.6,s.l)}
}
const PT=[];
function spawnPetal(x,y){PT.push({x:x==null?R(0,W):x,y:y==null?-12:y,vy:R(.5,1.3),ph:R(0,7),sp:R(.002,.005),sz:R(.7,1.4),h:[340,350,320,10,45][Math.random()*5|0],r:R(0,6.28)})}
function drawPetals(dt){
  if(PT.length<28&&Math.random()<.05*dt/16)spawnPetal();
  for(let i=PT.length-1;i>=0;i--){const p=PT[i],z=p.sz;p.y+=p.vy*dt/16;p.x+=(Math.sin(t*.0015+p.ph)*.7+.25)*dt/16;p.r+=.02*dt/16;
    if(p.y>H*1.02||p.x>W+20){PT.splice(i,1);continue}
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.scale(Math.cos(t*p.sp*3+p.ph),1);ctx.fillStyle=`hsla(${p.h},85%,${night>.5?78:84}%,.85)`;
    ctx.beginPath();ctx.moveTo(0,-7*z);ctx.bezierCurveTo(6*z,-5*z,6*z,4*z,0,8*z);ctx.bezierCurveTo(-6*z,4*z,-6*z,-5*z,0,-7*z);ctx.fill();ctx.restore()}
}

/* ===== ผีเสื้อ ===== */
const BF=[330,45,280,190,10,310].map(h=>({x:R(0,innerWidth),y:R(innerHeight*.2,innerHeight*.7),vx:0,vy:0,ph:R(0,7),h,tx:R(.05,.95),ty:R(.15,.75),tt:0}));
function wing(s,h){
  const g=ctx.createRadialGradient(8*s,-6*s,1,8*s,-6*s,16*s);g.addColorStop(0,`hsla(${h},95%,84%,.95)`);g.addColorStop(1,`hsla(${h+25},85%,62%,.92)`);
  ctx.fillStyle=g;ctx.strokeStyle='rgba(255,255,255,.7)';ctx.lineWidth=.8;
  ctx.beginPath();ctx.ellipse(9*s,-7*s,11*s,8*s,-.5,0,7);ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.ellipse(7*s,6*s,7*s,5.5*s,.5,0,7);ctx.fill();ctx.stroke()
}
function drawBF(b,dt){
  const k=dt/16,s=.95*U;b.tt-=dt;if(b.tt<=0){b.tt=R(2000,5000);b.tx=R(.05,.95);b.ty=R(.15,.78)}
  const dx=b.tx*W-b.x,dy=b.ty*H-b.y,d=Math.hypot(dx,dy)||1;
  b.vx+=(dx/d*.04+Math.sin(b.ph*.7)*.05)*k;b.vy+=(dy/d*.04+Math.cos(b.ph*1.3)*.08)*k;b.vx*=.97;b.vy*=.97;
  const v=Math.hypot(b.vx,b.vy);if(v>2.2){b.vx*=2.2/v;b.vy*=2.2/v}
  b.x+=b.vx*k;b.y+=b.vy*k;b.ph+=dt*.018;
  ctx.save();ctx.translate(b.x,b.y);ctx.rotate(Math.max(-.5,Math.min(.5,b.vx*.12)));
  const f=.25+.75*Math.abs(Math.sin(b.ph));
  for(const sd of[1,-1]){ctx.save();ctx.scale(sd*f,1);wing(s,b.h);ctx.restore()}
  ctx.fillStyle='#4a2a3a';ctx.beginPath();ctx.ellipse(0,0,1.8*s,8*s,0,0,7);ctx.fill();
  ctx.strokeStyle='#4a2a3a';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(0,-7*s);ctx.lineTo(-4*s,-13*s);ctx.moveTo(0,-7*s);ctx.lineTo(4*s,-13*s);ctx.stroke();ctx.restore();
  if(Math.random()<.2)sp.push({x:b.x,y:b.y+4,vx:R(-.3,.3),vy:R(.2,.6),l:.9,dc:.02,sz:1.3,k:0})
}

/* ===== เพลง ===== */
let AC,master,songBad=false,SRC=[],si=0,musicOn=false,step=0,nt=0,timer,el;
const CH=[[65.41,261.63,329.63,392,523.25],[98,196,246.94,293.66,392],[110,220,261.63,329.63,440],[82.41,164.81,196,246.94,329.63],[87.31,174.61,220,261.63,349.23],[65.41,261.63,329.63,392,523.25],[87.31,174.61,220,261.63,349.23],[98,196,246.94,293.66,392]];
const PAT=[1,2,3,4,3,2,3,2];
function initAudio(){
  if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.55;
  const dl=AC.createDelay(),fb=AC.createGain(),wet=AC.createGain();dl.delayTime.value=.32;fb.gain.value=.38;wet.gain.value=.35;
  master.connect(AC.destination);master.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(AC.destination)
}
function mk(f,vol,dur,type,when){
  when=when||AC.currentTime;
  [[f,vol,dur,type||'sine'],[f*3,vol*.15,dur*.4,'sine']].forEach(a=>{
    const o=AC.createOscillator(),g=AC.createGain();o.type=a[3];o.frequency.value=a[0];
    g.gain.setValueAtTime(0,when);g.gain.linearRampToValueAtTime(a[1],when+.01);g.gain.exponentialRampToValueAtTime(.0001,when+a[2]);
    o.connect(g);g.connect(master);o.start(when);o.stop(when+a[2]+.05)})
}
function sched(){
  while(nt<AC.currentTime+.7){
    const bar=(step/8|0)%8,i=step%8,c=CH[bar];
    mk(c[PAT[i]],.11,1.2,'sine',nt);
    if(i==0)mk(c[0],.16,2,'triangle',nt);
    if(i==4||(i==6&&bar%2))mk(c[4]*(i==4?1:1.5),.07,1.6,'sine',nt);
    step++;nt+=.42
  }
}
function chime(){
  if(!musicOn)return;initAudio();AC.resume();
  mk([523.25,587.33,659.25,783.99,880,1046.5,1174.66][Math.random()*7|0],.16,1.6)
}
function songSrc(u){if(u.indexOf('data:')!==0)return u;try{const b=atob(u.split(',')[1]),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return URL.createObjectURL(new Blob([a],{type:'audio/mpeg'}))}catch(e){return u}}
function setMusic(on){
  musicOn=on;$('mus').textContent=on?'🎵':'🔇';
  if(CONFIG.musicUrl&&!songBad){
    if(!el){SRC=['song.mp3',CONFIG.musicUrl,'blob'];si=0;el=new Audio(SRC[0]);el.loop=true;el.onerror=()=>{
      const code=el.error?el.error.code:0;si++;
      if(si<SRC.length){el.src=SRC[si]=='blob'?songSrc(CONFIG.musicUrl):SRC[si];el.load();if(musicOn)el.play().catch(()=>{});return}
      songBad=true;toast('⚠️ โหลดเพลงไม่สำเร็จ (รหัส '+code+') ใช้เพลงสำรองแทน');if(musicOn)setMusic(true)}}
    if(on){const p=el.play();if(p&&p.catch)p.catch(e=>{if(!e||e.name!='NotAllowedError')return;songBad=true;toast('⚠️ เล่นเพลงของคุณไม่ได้ ตอนนี้ใช้เพลงสำรองแทน');setMusic(true)})}else el.pause();
    return}
  if(el)el.pause();
  initAudio();
  if(on){AC.resume();nt=AC.currentTime+.1;if(!timer)timer=setInterval(sched,150)}else AC.suspend()
}

/* ===== วนลูปหลัก ===== */
function loop(ts){
  const dt=Math.min(50,ts-(last||ts));last=ts;t=ts;
  night+=(nT-night)*Math.min(1,.03*dt/16);
  ctx.setTransform(D,0,0,D,0,0);ctx.globalAlpha=1;ctx.drawImage(bg,0,0,W,H);
  if(night>.01){ctx.globalAlpha=night;ctx.drawImage(bgN,0,0,W,H);ctx.globalAlpha=1}
  drawGlints();for(const f of flowers)drawF(f);
  ctx.globalAlpha=1-night;ctx.drawImage(fg,0,0,W,H);ctx.globalAlpha=night;ctx.drawImage(fgN,0,0,W,H);
  ctx.globalAlpha=1-night*.8;for(const b of BF)drawBF(b,dt);ctx.globalAlpha=1;
  drawNight(dt);drawPetals(dt);drawSp(dt);requestAnimationFrame(loop)
}
cv.addEventListener('pointerdown',e=>{
  const x=e.clientX,y=e.clientY;
  for(let i=flowers.length-1;i>=0;i--){
    const f=flowers[i],rad=Math.max(30,f.r*(f.bloom>.5?1.1:1.2)+8);
    if(Math.hypot(x-f.hx,y-f.hy)<rad){if(!f.want)bloomIt(f);else{burst(f.hx,f.hy,12);chime()}return}
  }
  if(y>H*.63&&flowers.length<45){
    const f=make(x/W,y/H,false);flowers.push(f);flowers.sort((a,b)=>a.fy-b.fy);setTimeout(()=>bloomIt(f),900);burst(x,y,8)
  }
});

  n.textContent=['ลองคิดดูอีกทีนะ 🥺','กดผิดแล้วมั้ง?','ใจร้ายอ่ะ','ปุ่มนี้เสียแล้วล่ะ'][nn-1];n.style.transform=`translate(${R(-90,90)}px,${R(-60,60)}px)`;$('yes').style.transform=`scale(${1+nn*.12})`});
$('yes').onclick=()=>{const d=CONFIG.startDate?Math.floor((Date.now()-new Date(CONFIG.startDate))/864e5):0;
  $('eQ').textContent='ขอบคุณที่ตอบตกลงนะ 💗';$('eSub').textContent=d>0?`เรารักกันมาแล้ว ${d} วัน และเค้าอยากให้เป็นแบบนี้ไปอีกนาน ๆ นะ`:'รักเธอที่สุดเลย';
  $('yes').style.display=$('no').style.display='none';$('back').style.display='';$('end').classList.add('clear');celebrate()};
$('back').onclick=()=>$('end').classList.add('off');
$('dn').onclick=()=>setNight(nT?0:1);
{const h=new Date().getHours();nT=night=(h>=18||h<6)?1:0;$('dn').textContent=night?'☀️':'🌙'}
addEventListener('resize',resize);
resize();
N=Math.round(Math.max(6,Math.min(12,W/90)));
for(let i=0;i<N;i++){const f=make((i+.5)/N+R(-.3,.3)/N,.72+(i%3)*.09+R(-.02,.02),true);flowers.push(f)}
flowers.sort((a,b)=>a.fy-b.fy);updCount();
requestAnimationFrame(loop);
